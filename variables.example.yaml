# variables.example.yaml
# Copy to variables.yaml and fill in values
clusterName: "demo-cluster"
baseDomain: "example.com"
clusterImageSetName: "img4.18.12-x86-64-appsub"   # oc get clusterimageset
ocpVersion: "4.18"
pullSecret: '{"auths":{}}'       # literal JSON (or set PULL_SECRET env var and omit here)
sshPublicKey: "ssh-ed25519 AAAA... user@host"
networking:
  machineNetworkCIDR: "192.168.10.0/24"
  serviceNetworkCIDR: "172.30.0.0/16"
  clusterNetworkCIDR: "10.128.0.0/14"
  hostPrefix: 23
  apiVIP: "192.168.10.5"
  ingressVIP: "192.168.10.6"
  ntpSources: ["time.google.com"]
proxy: {}   # or {httpProxy: "http://proxy:3128", httpsProxy: "http://proxy:3128", noProxy: ".svc,.cluster.local,${baseDomain}"}
installConfigOverrides: |
  {}         # Raw JSON that will be merged into install-config (optional)
hosts:
  - hostname: "master-0"
    role: "master"
    interfaces:
      - name: "ens192"
        macAddress: "00:50:56:aa:bb:01"
        ipv4:
          address: "192.168.10.11"
          prefixLength: 24
          gateway: "192.168.10.1"
          dns: ["192.168.10.10"]
  - hostname: "master-1"
    role: "master"
    interfaces:
      - name: "ens192"
        macAddress: "00:50:56:aa:bb:02"
        ipv4:
          address: "192.168.10.12"
          prefixLength: 24
          gateway: "192.168.10.1"
          dns: ["192.168.10.10"]
  - hostname: "master-2"
    role: "master"
    interfaces:
      - name: "ens192"
        macAddress: "00:50:56:aa:bb:03"
        ipv4:
          address: "192.168.10.13"
          prefixLength: 24
          gateway: "192.168.10.1"
          dns: ["192.168.10.10"]
  - hostname: "worker-0"
    role: "worker"
    interfaces:
      - name: "ens192"
        macAddress: "00:50:56:aa:bb:11"
        ipv4:
          address: "192.168.10.21"
          prefixLength: 24
          gateway: "192.168.10.1"
          dns: ["192.168.10.10"]
namespace: "cluster-${clusterName}"
enableAddons:
  observability: true
  policyController: true
  searchCollector: true
